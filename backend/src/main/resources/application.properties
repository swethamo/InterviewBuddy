spring.application.name=interview-buddy

# Store the local database on disk, relative to the backend working directory.
spring.datasource.url=jdbc:h2:file:./data/interviewbuddy
spring.datasource.username=sa
spring.datasource.password=

# Update tables from entity definitions during local development.
spring.jpa.hibernate.ddl-auto=update

# Keep database access inside the service/repository workflow.
spring.jpa.open-in-view=false

# Answer generation uses the OpenAI Responses API. Keep the API key on the backend.
answer.generation.provider=${ANSWER_GENERATION_PROVIDER:}
answer.generation.api-key=${OPENAI_API_KEY:}
answer.generation.model=${ANSWER_GENERATION_MODEL:gpt-4.1-mini}
answer.generation.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
answer.generation.timeout=${ANSWER_GENERATION_TIMEOUT:25s}