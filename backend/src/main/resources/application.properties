spring.application.name=interview-buddy

# Store the local database on disk, relative to the backend working directory.
spring.datasource.url=jdbc:h2:file:./data/interviewbuddy
spring.datasource.username=sa
spring.datasource.password=

# Update tables from entity definitions during local development.
spring.jpa.hibernate.ddl-auto=update

# Keep database access inside the service/repository workflow.
spring.jpa.open-in-view=false